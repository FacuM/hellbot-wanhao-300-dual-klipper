# This file contains common pin mappings for MKS Robin Nano V3
# boards. To use this config, the firmware should be compiled for the
# stm32f407. When running "make menuconfig", select the 48KiB
# bootloader, and enable "USB for communication".

# The "make flash" command does not work on the MKS Robin. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "Robin_nano_v3.bin" on an SD card and then restart the
# MKS Robin with that SD card.

# This file is a combination of the work done by the manufacturer of the
# 3D printer (Wanhao), the generic MKS Robin Nano V3/1.3 configuration and my
# own adjustments.
#
# Pin asssignments are known to differ between the generic MKS Robin Nano V3/1.3
# boards and those shipped with Wanhao Duplicator and/or Hellbot printers.
# For that reason, this file combines part of the setup from the following files:
# https://github.com/Yumi-Lab/yumi-config/blob/main/smartpad-wanhao-D12230-DUAL-MKS1.3-2TMC-3A498/printer.cfg
# https://github.com/Yumi-Lab/yumi-config/blob/main/smartpad-wanhao-D12300-MKS1.3-3TMC-2A498/MKS%20Robin%20Nano(-S)%20V1.3%20settings.png
# https://github.com/Yumi-Lab/yumi-config/blob/main/smartpad-wanhao-D12300-MKS1.3-3TMC-2A498/printer.cfg

# You may be able to adapt this file to your own printer by changing the print
# area dimensions and the maximum values for the axes and endstops, especially
# if you have any of the following printers:
#
# - Wanhao Duplicator 12 230
# - Wanhao Duplicator 12 230 Dual
# - Wanhao Duplicator 12 300
# - Wanhao Duplicator 12 300 Dual
# - Hellbot Magna 2 300 (v1)
# - Hellbot Magna 2 300 Dual (v1)

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PE3
dir_pin: PE2
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: !PA15
position_endstop: 0
position_max: 330
position_min:-30
homing_speed: 60

[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: !PA12
position_endstop: 0
position_max: 300
position_min: 0
homing_speed: 60

[stepper_z]
step_pin: PB5
dir_pin: PB4  #!PB4 pour A4988 et PB4 pour TMC2209
enable_pin: !PB8
microsteps: 16
rotation_distance: 8
endstop_pin: !PA11
position_endstop: 0
position_max: 365
position_min: -2
homing_speed: 10

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 16
# rotation_distance: 22.6789511 #before 33.500 #rotation_distance: 22.6789511 #Bondtech 5mm Drive Gears
rotation_distance: 23.9338164721 # fix for Hellbot Magna 2 300, test different values if yours differs
gear_ratio: 3:1    #TITAN Gear Ratio 3:1 ,  BMG Raatio 50:17
full_steps_per_rotation: 200 #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC1
#control: pid
#pid_Kp: 14.669
#pid_Ki: 0.572
#pid_Kd: 94.068
min_temp: 0
max_temp: 250
max_extrude_only_velocity: 60
max_extrude_only_distance: 500
max_extrude_cross_section: 100
pressure_advance: 0.66

[extruder_stepper extruder1] #T1
extruder: extruder
step_pin: PA6
dir_pin: !PA1
enable_pin: !PA3
full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 7.952

[heater_bed]
heater_pin: PA0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
control: pid
pid_Kp: 325.10
pid_Ki: 63.35
pid_Kd: 417.10
min_temp: 0
max_temp: 90

[fan]
pin: PB1

[display_status]
[pause_resume]

[respond]
default_type: echo

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[virtual_sdcard]
path: ~/printer_data/gcodes

[filament_switch_sensor filament_sensor]  
pause_on_runout: True
runout_gcode: PAUSE # pause when filament runout
#insert_gcode: RESUME  
switch_pin: PA4

[filament_switch_sensor filament_sensor1]
pause_on_runout: True
runout_gcode: PAUSE # pause when filament runout
#insert_gcode: RESUME  
switch_pin: PE6

[bed_screws]
screw1: 60, 60
screw1_name: front left screw
screw2: 250, 60
screw2_name: front right screw
screw3: 250, 250
screw3_name: rear right screw
screw4: 60, 250
screw4_name: rear left screw

[screws_tilt_adjust]
screw1: 20, 40
screw1_name: front left screw
screw2: 270, 40
screw2_name: front right screw
screw3: 270, 270
screw3_name: rear right screw
screw4: 40, 270
screw4_name: rear left screw
horizontal_move_z: 10
speed: 80

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 1800                 # ~21 Hz resonances: higher accel adds smoothing
max_z_velocity: 25
max_z_accel: 100

[safe_z_home]
home_xy_position: 145,115
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0

[input_shaper]
# Measured with a ringing tower printed with the shaper disabled (walls at
# 80 mm/s, f = V / ripple wavelength): X ~3.6 mm -> ~22 Hz, Y ~3.7-3.9 mm ->
# ~21 Hz. The previous Y value (32.3 Hz) was far off and Y kept ringing.
shaper_freq_x: 22.0
shaper_freq_y: 21.0
shaper_type: mzv

[gcode_arcs]
resolution: 0.05

[exclude_object]

[verify_heater extruder]
max_error : 200
check_gain_time : 20
hysteresis : 5
Heating_gain : 2

#####################################################################
#MACRO
#####################################################################


[gcode_macro PRINT_START]  
gcode:
    RESPOND MSG="STARTING TO PRINT"
    save_last_file
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
    G92 E0                                         
	  G90             
    CLEAR_PAUSE
    G28               

[gcode_macro PRINT_END]
gcode:    
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  clear_last_file
  RUN_SHELL_COMMAND CMD=clear_plr
  G1 X0 Y0
  M104 S0 ; Turn off extruder
  M140 S0 ; Turn off heated bed
  M106 S0 ; Turn off extruder fan
  M107 ; Turn off chamber fan
  M84 ; Disable motors



[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  RUN_SHELL_COMMAND CMD=clear_plr
  clear_last_file
  PRINT_END
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} 
  #SDCARD_RESET_FILE
  M400              ; wait for buffer to clear
  G92 E0            ; zero the extruder
  G1 E-10.0 F1200 	; retract filament
  M106 S0
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  G91 
  M107 	            ; turn off fan
  G1 Z2 F3000 
  G90
  G0 X0 Y230 F6000
  M84

[gcode_macro PID_EXTRUDER]
gcode:
  G28
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET=190
  SAVE_CONFIG

[gcode_macro PID_BED]
gcode:
  G28
  M106 S255
  PID_CALIBRATE HEATER=heater_bed TARGET=60
  SAVE_CONFIG

[gcode_macro M84]
rename_existing:M84.1
gcode:
      SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
      SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
      SET_STEPPER_ENABLE STEPPER=stepper_z enable=0
      SET_STEPPER_ENABLE STEPPER=extruder  enable=0
      SET_KINEMATIC_POSITION

[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   
    {% endif %}

[gcode_macro M191]
gcode:
      {% set s = params.S|float %}
      {% if params.S is defined %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.S|int}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-4} MAXIMUM={s+10} 
      {% endif %}

[gcode_macro M201]
description: Sets maximum accelleration.
  Usage: M201 [X<accel>] [Y<accel>]
gcode:
  {% if 'X' in params or 'Y' in params %}
  {% set accel = (params.X|default(params.Y)|float, params.Y|default(params.X)|float)|min %}
  SET_VELOCITY_LIMIT ACCEL={accel} ACCEL_TO_DECEL={accel * 0.5}
  {% else %}
  SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M203]
description: Sets maximum velocity.
  Usage: M203 [X<velocity>] [Y<velocity>]
gcode:
  {% if 'X' in params or 'Y' in params %}
    {% set velocity = (params.X|default(params.Y)|float,
                       params.Y|default(params.X)|float)|min %}
    SET_VELOCITY_LIMIT VELOCITY="{velocity}"
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M204]
description: Sets maximum accelleration.
  Usage: M204 [S<accel>] [P<accel> T<accel>]
rename_existing: M204.1
gcode:
  {% set f = params.F|default(0.5)|float %}
  {% if 'S' in params %}
  {% set s = params.S|float %}
  SET_VELOCITY_LIMIT ACCEL={s} ACCEL_TO_DECEL={ s * f }
  {% else %}
  {% if 'P' in params %}
  {% set p = params.P|float %}
  {% if 'T' in params %}
  {% set t = params.T|float %}
  {% if p < t %}
  SET_VELOCITY_LIMIT ACCEL={p} ACCEL_TO_DECEL={ p * f }
  {% else %}
  SET_VELOCITY_LIMIT ACCEL={t} ACCEL_TO_DECEL={ t * f }
  {% endif %}
  {% else %}
  SET_VELOCITY_LIMIT ACCEL={p} ACCEL_TO_DECEL={ p * f }
  {% endif %}
  {% elif 'T' in params %}
  {% set t = params.T|float %}
  SET_VELOCITY_LIMIT ACCEL={t} ACCEL_TO_DECEL={ t * f }
  {% endif %}
  {% endif %}

[gcode_macro M205]
description: Sets square corner velocity.
  Usage: M205 [X<velocity>] [Y<velocity>]
gcode:
  {% if 'X' in params or 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY="{
      (params.X|default(0)|float, params.Y|default(0)|float)|min}"
  {% else %}
    SET_VELOCITY_LIMIT
  {% endif %}

[gcode_macro M600]
gcode:
  PAUSE

[gcode_macro M601]
gcode:
    PAUSE

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
gcode:
  SAVE_GCODE_STATE NAME=unload_state
  G91
  {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
    M117 Heating...
    # Heat up hotend to provided temp or 220 as default as that should work OK with most filaments.
    M109 S{params.TEMP|default(220, true)}
  {% endif %}
  M117 Unloading filament...
  G92 E0.0
  M83
  _FORM_TIP                  ; park at the shared distance (_FORM_TIP distance)
  G90
  G92 E0.0
  M400
  M117 Remove Filament Now!
  M117 Filament unloaded!
  RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro LOAD_FILAMENT]
gcode:
  SAVE_GCODE_STATE NAME=load_state
  G91
  # Heat up hotend to provided temp or 220 as default as that should work OK with most filaments.
  {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
  M117 Heating...
  M109 S{params.TEMP|default(220, true)}
  {% endif %}
  M117 Loading filament...
  # Load the filament into the hotend area.
  G92 E0.0
  G91
  G1 E70 F400
  G1 E40 F100
  G90
  G92 E0.0
  M400
  M117 Filament loaded!
  RESTORE_GCODE_STATE NAME=load_state

[gcode_macro T0]
gcode:
    # Deactivate second extruder stepper
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=
    # Activate first extruder stepper
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    SET_PRESSURE_ADVANCE ADVANCE=0 EXTRUDER=extruder
    RESPOND MSG="Extruder T0"


[gcode_macro T1]
gcode:
    # Deactivate first extruder stepper
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=
    # Activate second extruder stepper
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
    SET_PRESSURE_ADVANCE ADVANCE=0 EXTRUDER=extruder1
    RESPOND MSG="Extruder T1"
    

[gcode_macro WIPE_NOZZLE]
description: Wipe the nozzle
# Purge and wipe happen off the bed. The bed is 300 mm wide but the carriage
# can reach X 330, so the default purge spot (X 325) is clear of any part.
# The old hardcoded X 255/233 sat on the bed and dropped purge blobs on parts.
variable_purge_x: 325.0        # where PURGE_NOZZLE and UNLOAD_PURGE park to purge
variable_wipe_x: 308.0         # inner end of the wipe stroke, still off the bed
variable_strokes: 4
gcode:
  {% set cfg = printer["gcode_macro WIPE_NOZZLE"] %}
  {% for i in range(cfg.strokes|int) %}
    G1 X{cfg.wipe_x} F6000
    G1 X{cfg.purge_x} F6000
  {% endfor %}


[gcode_macro PURGE_NOZZLE]
description: Purge the nozzle
# Retract after the purge so the full nozzle does not ooze on the way back
# (that left small blobs next to the part), and push it back once there.
variable_retract_mm: 1.5
gcode:
  {% set retract = printer["gcode_macro PURGE_NOZZLE"].retract_mm|float %}
  # Store the current position in a variable
  {%set z_pos = printer.gcode_move.gcode_position.z | float %}
  {%set x_pos = printer.gcode_move.gcode_position.x | float %}
  {%set y_pos = printer.gcode_move.gcode_position.y | float %}
  RESPOND MSG="Current Z is {z_pos}"
  RESPOND MSG="Current X is {x_pos}"
  RESPOND MSG="Current Y is {y_pos}"
  {% set new_z = z_pos + 0.4 %}     ; Calcule la nouvelle position de Z en ajoutant 0.4 mm      
  RESPOND MSG="New Z is {new_z}"
  G1 Z{new_z} F900
  G1 X{printer["gcode_macro WIPE_NOZZLE"].purge_x} F6000 ; Move off the bed to purge
  G92 E0 #reset extrudeuse
  G91 #mode relatif
  M106 S255                ; Set the fan speed to maximum (255)
  RESPOND MSG="LOAD Filament" ; Send a message to the user to load the filament
  G1 E100 F1500            ; Extrude 100 mm of filament at a feedrate of 1500 mm/min
  RESPOND MSG="PURGE"      ; Send a message to the user indicating the purge is starting
  G1 E30 F1500             ; Extrude 30 mm of filament at a feedrate of 1500 mm/min
  G1 E20 F200              ; Extrude an additional 20 mm of filament at a slower feedrate of 200 mm/min
  G1 E-{retract} F2400     ; Retract so the nozzle does not ooze while wiping and travelling back
  G90 #retour au mode absolu
  RESPOND MSG="WIPE NOZZLE" 
  WIPE_NOZZLE              ; Custom command to wipe the nozzle, ensure this macro or command exists
  M106 S128                ; Set the fan speed to half (128)
  # Restore the Z position when needed
  RESPOND MSG="GO BACK PRINT POSITION" 
  G1 Y{y_pos} ; Move to the saved Y position
  G1 X{x_pos} ; Move to the saved X position
  {% set new_z = new_z - 0.4 %} 
  G1 Z{new_z} F900 ; Move to the saved Z position
  G91
  G1 E{retract} F1200      ; Undo the retraction before printing resumes
  G90



[gcode_macro _FORM_TIP]
description: Shape the filament tip before retracting it out of the hotend
# Both tools share one hotend through a Y splitter, so every tool change
# drags the hot filament tip up through the splitter. A slow, single long
# retraction leaves a swollen "mushroom" tip and strings that get scraped off
# inside the splitter and block the next filament. This macro follows the
# usual MMU tip-shaping recipe instead:
#   1. optional ramming to pack the melt zone,
#   2. fast short retraction to pull the tip out of the melt zone,
#   3. slow retraction into the cold zone,
#   4. a few in/out cooling moves so the tip sets as a thin cone,
#   5. the long retraction that parks the tip above the Y junction.
# Expects relative extrusion (M83) and a hot extruder. Every value can be
# overridden per call, e.g. _FORM_TIP DISTANCE=80 COOLING_MOVES=3
# Tune COOLING_ZONE first: it is the distance from the melt zone to the cold
# part of the heatbreak on this hotend.
variable_ram_mm: 2.0           # mm pushed before retracting (0 disables it)
variable_ram_speed: 15         # mm/s
variable_fast_mm: 12.0         # first, fast retraction out of the melt zone
variable_fast_speed: 45        # mm/s (max_extrude_only_velocity is 60)
variable_cooling_zone: 4.0     # extra slow retraction into the cold zone
variable_slow_speed: 10        # mm/s
variable_cooling_moves: 4      # in/out moves inside the cold zone
variable_cooling_mm: 4.0       # length of each cooling move
variable_cooling_speed_start: 2.5  # mm/s, first cooling move
variable_cooling_speed_end: 4.0    # mm/s, last cooling move
variable_dwell_ms: 500         # pause before parking so the tip sets
variable_distance: 150.0       # park distance: tip ends this far above the nozzle. Shared by
                               # UNLOAD_PURGE, UNLOAD_FILAMENT and LOAD_TOOL. 80-90 left the thin
                               # string at the tip hanging in the common part of the Y splitter,
                               # where it blocked the other filament. ~180 was confirmed by hand.
variable_park_speed: 25        # mm/s
gcode:
  {% set cfg = printer["gcode_macro _FORM_TIP"] %}
  {% set ram = params.RAM_MM|default(cfg.ram_mm)|float %}
  {% set ram_f = params.RAM_SPEED|default(cfg.ram_speed)|float * 60 %}
  {% set fast = params.FAST_MM|default(cfg.fast_mm)|float %}
  {% set fast_f = params.FAST_SPEED|default(cfg.fast_speed)|float * 60 %}
  {% set slow = params.COOLING_ZONE|default(cfg.cooling_zone)|float %}
  {% set slow_f = params.SLOW_SPEED|default(cfg.slow_speed)|float * 60 %}
  {% set moves = params.COOLING_MOVES|default(cfg.cooling_moves)|int %}
  {% set cool = params.COOLING_MM|default(cfg.cooling_mm)|float %}
  {% set v0 = params.COOLING_SPEED_START|default(cfg.cooling_speed_start)|float %}
  {% set v1 = params.COOLING_SPEED_END|default(cfg.cooling_speed_end)|float %}
  {% set dwell = params.DWELL_MS|default(cfg.dwell_ms)|int %}
  {% set total = params.DISTANCE|default(cfg.distance)|float %}
  {% set park_f = params.PARK_SPEED|default(cfg.park_speed)|float * 60 %}
  {% set park = total + ram - fast - slow %}
  {% if printer[printer.toolhead.extruder].can_extrude|lower != 'true' %}
    RESPOND TYPE=error MSG="_FORM_TIP: hotend too cold, plain retraction without tip shaping"
    G1 E-{total} F{park_f}
  {% else %}
    {% if ram > 0 %}
      G1 E{ram} F{ram_f}
    {% endif %}
    G1 E-{fast} F{fast_f}
    G1 E-{slow} F{slow_f}
    {% for i in range(moves) %}
      {% set f = (v0 + (v1 - v0) * (i / ([moves - 1, 1]|max))) * 60 %}
      G1 E{cool} F{f}
      G1 E-{cool} F{f}
    {% endfor %}
    {% if dwell > 0 %}
      G4 P{dwell}
    {% endif %}
    {% if park > 0 %}
      G1 E-{park} F{park_f}
    {% endif %}
  {% endif %}
  M400

[gcode_macro LOAD_TOOL]
description: Reload the parked filament of the active tool (no purge)
# Counterpart of UNLOAD_PURGE for tool changes. UNLOAD_PURGE parks the tip
# at the _FORM_TIP park distance; this pushes it back down so the prime tower
# can do the actual purge as printed lines, instead of dumping a stationary
# purge off the bed (which left strings around the bed and on the part).
# Loads in place with a small Z lift: almost nothing comes out while the
# filament is only refilling the path. Expects relative extrusion (M83).
variable_load_mm: 0             # 0 = use the _FORM_TIP park distance (recommended)
variable_slow_mm: 10.0         # last part of the load, slow, so the tip does not slam the nozzle
variable_fast_speed: 40        # mm/s
variable_slow_speed: 5         # mm/s
variable_z_lift: 1.0           # mm
gcode:
  {% set cfg = printer["gcode_macro LOAD_TOOL"] %}
  {% set load = cfg.load_mm|float if cfg.load_mm|float > 0 else printer["gcode_macro _FORM_TIP"].distance|float %}
  {% set fast = load - cfg.slow_mm|float %}
  {% if printer[printer.toolhead.extruder].can_extrude|lower != 'true' %}
    RESPOND TYPE=error MSG="LOAD_TOOL: hotend too cold, filament not loaded"
  {% else %}
    SAVE_GCODE_STATE NAME=load_tool_state
    G91
    G1 Z{cfg.z_lift} F600
    M83
    {% if fast > 0 %}
      G1 E{fast} F{cfg.fast_speed|float * 60}
    {% endif %}
    G1 E{cfg.slow_mm} F{cfg.slow_speed|float * 60}
    G1 Z-{cfg.z_lift} F600
    RESTORE_GCODE_STATE NAME=load_tool_state
  {% endif %}

[gcode_macro UNLOAD_PURGE]
description: Purge the nozzle
gcode:
  # Store the current position in a variable
  {%set z_pos = printer.gcode_move.gcode_position.z | float %}
  {%set x_pos = printer.gcode_move.gcode_position.x | float %}
  {%set y_pos = printer.gcode_move.gcode_position.y | float %}
  RESPOND MSG="Current Z is {z_pos}"
  RESPOND MSG="Current X is {x_pos}"
  RESPOND MSG="Current Y is {y_pos}"
  {% set new_z = z_pos + 0.4 %}     ; Calcule la nouvelle position de Z en ajoutant 0.4 mm      
  RESPOND MSG="New Z is {new_z}"
  G1 Z{new_z} F900
  G90                        ; Set to absolute positioning
  G1 X{printer["gcode_macro WIPE_NOZZLE"].purge_x} F6000 ; Move off the bed to unload
  M106 S255                  ; Set fan speed to maximum
  M83                        ; Set extruder to relative mode
  RESPOND MSG="UNLOAD FILAMENT"
  _FORM_TIP                  ; Shape the tip and park it above the Y splitter
  RESPOND MSG="GO BACK PRINT POSITION"
  G1 Y{y_pos} ; Move to the saved Y position
  G1 X{x_pos} ; Move to the saved X position
  {% set new_z = new_z - 0.4 %} 
  G1 Z{new_z} F900 ; Move to the saved Z position
    
